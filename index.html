<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Портфолио разработчика Adel. Автоматизация, десктопные приложения и веб-разработка. Чистый код и удобные решения.">
    <title>Adel · Портфолио разработчика</title>
    <style>
        /* ===== CSS Переменные ===== */
        :root {
            /* ТЁМНАЯ ТЕМА */
            --bg-primary: #130a1e;
            --bg-card: #1c112b;
            --bg-card-hover: #261638;
            --accent: #a855f7;
            --accent-light: #c084fc;
            --accent-glow: rgba(168, 85, 247, 0.25);
            --text-primary: #f3e8ff;
            --text-secondary: #b8a3d0;
            --text-muted: #8b75a8;
            --border: #2d1b4e;
            --radius: 16px;
        }

        /* СВЕТЛАЯ ТЕМА */
        [data-theme="light"] {
            --bg-primary: #f5f0ff;
            --bg-card: #ffffff;
            --bg-card-hover: #f0e6ff;
            --accent: #7c3aed;
            --accent-light: #9333ea;
            --accent-glow: rgba(124, 58, 237, 0.15);
            --text-primary: #1e1e2f;
            --text-secondary: #6b6b80;
            --text-muted: #9b8ba5;
            --border: #e9d9ff;
        }

        /* ===== Базовые стили ===== */
        html {
            scroll-behavior: smooth;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }

        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== Заголовок ===== */
        .header {
            text-align: center;
            padding: 3rem 0 4rem 0;
            border-bottom: 1px solid var(--border);
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            letter-spacing: -1px;
            margin-bottom: 0.5rem;
        }

        .header h1 span {
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .subtitle {
            font-size: 1.25rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-bottom: 0.5rem;
        }

        .header .bio {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto 1.5rem auto;
            line-height: 1.6;
        }

        .header .contacts {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .header .contacts a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.5rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 50px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.02);
        }

        .header .contacts a:hover {
            background: var(--bg-card-hover);
            color: var(--text-primary);
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* ===== Сетка карточек ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
            align-items: start; /* Важно для аккордеона */
        }

        /* ===== Карточка ===== */
        .card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 1.5rem;
            border: 1px solid var(--border);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            cursor: pointer;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out forwards;
            position: relative;
        }

        .card:hover {
            border-color: var(--accent);
            background: var(--bg-card-hover);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5), 0 0 20px var(--accent-glow);
        }

        .card .tag {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .card h2 {
            font-size: 1.4rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card h2::after {
            content: "▼";
            font-size: 0.8rem;
            color: var(--text-muted);
            transition: transform 0.3s ease;
        }

        .card.active h2::after {
            transform: rotate(180deg);
            color: var(--accent);
        }

        /* Скрытый контент */
        .card-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, opacity 0.3s ease;
            opacity: 0;
        }

        .card.active .card-content {
            max-height: 2000px; /* Достаточно много, чтобы влезло всё */
            opacity: 1;
            margin-top: 1rem;
        }

        .card p {
            color: var(--text-secondary);
            margin-bottom: 1.2rem;
            font-size: 0.95rem;
            line-height: 1.7;
        }

        .card ul {
            list-style: none;
            margin: 0 0 1.5rem 0;
            padding: 0;
        }

        .card ul li {
            padding: 0.4rem 0;
            padding-left: 1.5rem;
            position: relative;
            font-size: 0.9rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }
        
        [data-theme="light"] .card ul li {
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
        }

        .card ul li:last-child {
            border-bottom: none;
        }

        .card ul li::before {
            content: "▹";
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: bold;
        }

        /* ===== Кнопки ===== */
        .btn-group {
            margin-top: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.7rem 1.2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9rem;
            transition: all 0.2s ease;
            flex: 1;
            min-width: 120px;
            text-align: center;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
            border: 1px solid var(--border);
        }
        
        [data-theme="light"] .btn-secondary {
            background: rgba(0, 0, 0, 0.03);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent);
            color: #fff;
            border: 1px solid var(--accent);
            font-weight: 600;
        }

        .btn-primary:hover {
            background: var(--accent-light);
            border-color: var(--accent-light);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        /* ===== Скриншоты ===== */
        .screenshots {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.8rem;
            margin: 1rem 0;
        }

        .screenshots a {
            border-radius: 12px;
            border: 1px solid var(--border);
            overflow: hidden;
            transition: all 0.3s ease;
            background: var(--bg-primary);
            display: block;
        }

        .screenshots a:hover {
            border-color: var(--accent);
            transform: scale(1.03);
        }

        .screenshots img {
            width: 100%;
            height: 100%;
            display: block;
            aspect-ratio: 16/10;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .screenshots a:hover img {
            transform: scale(1.1);
        }

        .screenshot-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-align: center;
            margin-top: 0.5rem;
            margin-bottom: 1rem;
            font-style: italic;
        }

        /* ===== Бейджи ===== */
        .feature-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.1);
            padding: 0.3rem 0.8rem;
            border-radius: 50px;
            font-size: 0.75rem;
            color: var(--accent-light);
            border: 1px solid rgba(168, 85, 247, 0.2);
            margin-right: 0.4rem;
            margin-bottom: 0.4rem;
        }
        
        [data-theme="light"] .feature-badge {
            background: rgba(124, 58, 237, 0.08);
        }

        /* ===== Подвал ===== */
        .footer {
            margin-top: 5rem;
            padding-top: 2rem;
            border-top: 1px solid var(--border);
            text-align: center;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: var(--accent-light);
            text-decoration: underline;
        }

        /* ===== Кнопка темы ===== */
        .theme-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: var(--bg-card);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--accent-glow);
            font-size: 20px;
            z-index: 1000;
            transition: transform 0.2s, background 0.3s;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        /* ===== Анимации ===== */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ===== Адаптив ===== */
        @media (max-width: 600px) {
            .header h1 { font-size: 2.2rem; }
            .header .subtitle { font-size: 1.1rem; }
            .projects-grid { grid-template-columns: 1fr; }
            .card { padding: 1.2rem; }
            .btn-group { flex-direction: column; }
            .btn { width: 100%; }
        }
    </style>
</head>
<body>

        <!-- Подключаем Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // ⚠️ ВСТАВЬ СВОЙ ANON КЛЮЧ
        const SUPABASE_URL = 'https://qoqflgpkbzvdtleidtjw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFvcWZsZ3BrYnp2ZHRsZWlkdGp3Iiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc5Mjk0ODE0MywiZXhwIjoyMTA4NTI0MTQzfQ.5q4asB-_LFhDnzikW_tWM37RzVq85YQGAEeP4ZMF0dU';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadPortfolio() {
            const grid = document.querySelector('.projects-grid');
            if (!grid) return;
            
            try {
                const { data: projects, error } = await db
                    .from('portfolio')
                    .select('*')
                    .eq('published', true)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                if (!projects || projects.length === 0) return;

                // Очищаем сетку (на всякий случай) и рендерим
                grid.innerHTML = '';

                projects.forEach((p, index) => {
                    // 1. Бейджи
                    let badgesHtml = '';
                    if (p.features && p.features.length > 0) {
                        badgesHtml = '<div style="margin-bottom: 1.2rem;">';
                        p.features.forEach(f => {
                            badgesHtml += `<span class="feature-badge">${f}</span>`;
                        });
                        badgesHtml += '</div>';
                    }

                    // 2. Картинка
                    let imageHtml = '';
                    if (p.image_url) {
                        imageHtml = `
                            <div class="screenshots" style="grid-template-columns: 1fr;">
                                <a href="${p.image_url}" target="_blank"><img src="${p.image_url}" alt="${p.title}"></a>
                            </div>
                        `;
                    }

                    // 3. Список деталей
                    let listHtml = '';
                    if (p.details && p.details.length > 0) {
                        listHtml = '<ul>';
                        p.details.forEach(d => {
                            listHtml += `<li>${d}</li>`;
                        });
                        listHtml += '</ul>';
                    }

                    // 4. Кнопка
                    let buttonHtml = '';
                    if (p.link_url) {
                        buttonHtml = `
                            <div class="btn-group">
                                <a href="${p.link_url}" target="_blank" rel="noopener" class="btn btn-primary">🌐 Открыть проект</a>
                            </div>
                        `;
                    }

                    // Собираем карточку
                    const card = document.createElement('article');
                    card.className = 'card';
                    card.style.animationDelay = `${index * 0.1}s`;
                    
                    // Вставляем описание как есть (оно может содержать HTML-теги, которые мы добавим в админке)
                    card.innerHTML = `
                        <div class="tag">${p.tag || 'Проект'}</div>
                        <h2>${p.title}</h2>
                        <div class="card-content">
                            <div class="description-html">${p.description}</div>
                            ${badgesHtml}
                            ${imageHtml}
                            ${listHtml}
                            ${buttonHtml}
                        </div>
                    `;

                    grid.appendChild(card);
                });

                // Навешиваем клики (аккордеон)
                document.querySelectorAll('.card').forEach(card => {
                    card.addEventListener('click', (e) => {
                        if (e.target.closest('a')) return;
                        card.classList.toggle('active');
                    });
                });

            } catch (err) {
                console.error('Ошибка загрузки:', err);
            }
        }

        // Логика темы
        const toggleBtn = document.getElementById('themeToggle');
        const htmlEl = document.documentElement;

        if (toggleBtn) {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            htmlEl.setAttribute('data-theme', savedTheme);
            toggleBtn.textContent = savedTheme === 'light' ? '☀️' : '🌙';

            toggleBtn.addEventListener('click', () => {
                const newTheme = htmlEl.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
                htmlEl.setAttribute('data-theme', newTheme);
                localStorage.setItem('theme', newTheme);
                toggleBtn.textContent = newTheme === 'light' ? '☀️' : '🌙';
            });
        }

        loadPortfolio();
    </script>
</body>
